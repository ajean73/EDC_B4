services:
  postgres:
    image: postgres:16-alpine
    container_name: shopwise-postgres
    environment:
      POSTGRES_DB: shopwise
      POSTGRES_USER: shopwise
      POSTGRES_PASSWORD: shopwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwise -d shopwise"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopwise-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopwise
      SPRING_DATASOURCE_USERNAME: shopwise
      SPRING_DATASOURCE_PASSWORD: shopwise
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
